<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Credit Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
            padding-bottom: 2rem;
            background-color: #f8f9fa;
        }
        .header {
            margin-bottom: 2rem;
            text-align: center;
        }
        .form-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="display-4">Credit Approval Prediction</h1>
            <p class="lead">Enter applicant information to predict credit approval</p>
        </div>
        
        <div class="form-container">
            <form action="/predict" method="post">
                <div class="row g-3">
                    <!-- Categorical features -->
                    <div class="col-md-6">
                        <label for="A1" class="form-label">Feature A1</label>
                        <select class="form-select" id="A1" name="A1" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="a">a</option>
                            <option value="b">b</option>
                        </select>
                    </div>
                    
                    <!-- Numerical features -->
                    <div class="col-md-6">
                        <label for="A2" class="form-label">Feature A2</label>
                        <input type="number" class="form-control" id="A2" name="A2" step="0.01" required>
                    </div>
                    
                    <!-- Add more feature inputs as needed -->
                    <div class="col-md-6">
                        <label for="A3" class="form-label">Feature A3</label>
                        <input type="number" class="form-control" id="A3" name="A3" step="0.01" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A4" class="form-label">Feature A4</label>
                        <select class="form-select" id="A4" name="A4" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="u">u</option>
                            <option value="y">y</option>
                            <option value="l">l</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A5" class="form-label">Feature A5</label>
                        <select class="form-select" id="A5" name="A5" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="g">g</option>
                            <option value="p">p</option>
                            <option value="gg">gg</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A6" class="form-label">Feature A6</label>
                        <select class="form-select" id="A6" name="A6" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="c">c</option>
                            <option value="d">d</option>
                            <option value="cc">cc</option>
                            <option value="i">i</option>
                            <option value="j">j</option>
                            <option value="k">k</option>
                            <option value="m">m</option>
                            <option value="r">r</option>
                            <option value="q">q</option>
                            <option value="w">w</option>
                            <option value="x">x</option>
                            <option value="e">e</option>
                            <option value="aa">aa</option>
                            <option value="ff">ff</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A7" class="form-label">Feature A7</label>
                        <select class="form-select" id="A7" name="A7" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="v">v</option>
                            <option value="h">h</option>
                            <option value="bb">bb</option>
                            <option value="j">j</option>
                            <option value="n">n</option>
                            <option value="z">z</option>
                            <option value="dd">dd</option>
                            <option value="ff">ff</option>
                            <option value="o">o</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A8" class="form-label">Feature A8</label>
                        <input type="number" class="form-control" id="A8" name="A8" step="0.01" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A9" class="form-label">Feature A9</label>
                        <select class="form-select" id="A9" name="A9" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="t">t</option>
                            <option value="f">f</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A10" class="form-label">Feature A10</label>
                        <select class="form-select" id="A10" name="A10" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="t">t</option>
                            <option value="f">f</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A11" class="form-label">Feature A11</label>
                        <input type="number" class="form-control" id="A11" name="A11" step="1" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A12" class="form-label">Feature A12</label>
                        <select class="form-select" id="A12" name="A12" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="t">t</option>
                            <option value="f">f</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A13" class="form-label">Feature A13</label>
                        <select class="form-select" id="A13" name="A13" required>
                            <option value="" selected disabled>Select value</option>
                            <option value="g">g</option>
                            <option value="p">p</option>
                            <option value="s">s</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A14" class="form-label">Feature A14</label>
                        <input type="number" class="form-control" id="A14" name="A14" step="1" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="A15" class="form-label">Feature A15</label>
                        <input type="number" class="form-control" id="A15" name="A15" step="1" required>
                    </div>
                </div>
                
                <div class="mt-4 d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Predict Approval</button>
                </div>
            </form>
        </div>
        
        <div class="footer">
            <p>Japanese Credit Screening Model</p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
